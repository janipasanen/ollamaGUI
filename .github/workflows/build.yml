name: Build & Test

on:
  push:
    branches: [ main, master, development, macOS-10.15 ]
  pull_request:
    branches: [ main, master, development, macOS-10.15 ]

jobs:
  build:
    strategy:
      # The Windows runner fails at `Run tests` on an upstream vite/rolldown bug
      # ([UNRESOLVED_ENTRY] on its own vite.config.ts, rolldown#10798). With the
      # default fail-fast, that one failure cancels ubuntu and macOS before they
      # compile anything — so the Rust tests never ran (#667). Keep every leg
      # running; Windows stays visibly red on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # NOTE: master / development target current macOS (host SDK default) plus
    # Linux and Windows — no MACOSX_DEPLOYMENT_TARGET pin here. The Catalina
    # (10.15) compatibility line lives on the `macOS-10.15` branch, which sets
    # MACOSX_DEPLOYMENT_TARGET=10.15 in its own workflow copy.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint & type-check
        run: npm run lint && npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Frontend
        run: npm run build

      # Tauri v2's wry/tao webview backend on Linux needs WebKit2GTK + GLib/GIO
      # development headers (not preinstalled on ubuntu-latest). macOS/Windows
      # ship their webview SDKs, so this step is Linux-only (#398).
      - name: Install Linux system dependencies (Tauri v2)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libgirepository1.0-dev librsvg2-dev libssl-dev pkg-config libsoup-3.0-dev

      # Run the Rust backend unit tests (~98 tests across ax/ooxml/odf/pdf_tools/
      # config_validation/browser_* modules). Ignored tests (the #67 Chromium
      # spike harness) are skipped automatically. Previously these ran only
      # locally; execute them in CI so backend regressions are caught (#415).
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # STEP 1 (#618): baseline formatting gate. `cargo fmt` sorts the mod
      # decls in lib.rs and wraps format! arguments, so this commit is recorded
      # in .git-blame-ignore-revs to keep `git blame` meaningful for that file.
      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      # STEP 2 (#618): clippy gate at the level already clean after the 7 lint
      # fixes (ptr_arg, question_mark, type_complexity, manual_contains,
      # manual_is_multiple_of, manual_pattern_char_comparison, doc_lazy_continuation).
      # Denies correctness/suspicious/perf; dead_code and style nits stay informational
      # (STEP 3 removes the dead code). ubuntu-only: clippy output is platform-
      # independent here (#618).
      - name: Rust clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --lib -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency vulnerability scanning (#37). Runs independently of the build so a
  # newly-disclosed advisory surfaces even when the build matrix is green.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm dependency audit
        # Audit production dependencies only (--omit=dev): vite/vitest and their
        # transitive dev deps are build/test tooling that never ships in the
        # Tauri binary; scoping to prod keeps this gate meaningful for the
        # shipped surface. The prod set is also the untrusted-input rendering
        # path (react-markdown, remark-gfm, remark-math, rehype-katex, katex,
        # mermaid, react-syntax-highlighter), so gate on moderate+ advisories —
        # XSS / prototype-pollution / DoS in these renderers are scored moderate.
        # STEP 1 (#619) bumped mermaid -> 11.16.1 and dompurify -> 3.4.17 to
        # clear those moderate advisories, so this gate is green on merge.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo dependency audit
        working-directory: src-tauri
        # .cargo/audit.toml (in src-tauri/) suppresses unmaintained advisories
        # for transitive crates we cannot easily upgrade, and documents the
        # tracked exception for the umya-spreadsheet quick-xml 0.37.5 copy
        # (#395). cargo-audit reads `.cargo/audit.toml`, not a bare audit.toml.
        run: cargo audit

  # Playwright browser E2E (#16b, #214). Runs on Ubuntu where Chromium is
  # installable; covers the web UI surface (Tauri-only features excluded).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Run Playwright E2E against production bundle (#613)
        run: PW_TARGET=preview npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

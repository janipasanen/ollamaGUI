name: Build & Test

on:
  push:
    branches: [ main, master, development, macOS-10.15 ]
  pull_request:
    branches: [ main, master, development, macOS-10.15 ]

jobs:
  build:
    strategy:
      # One OS hiccup (e.g. a timing-flaky UI test on a slow Windows runner)
      # used to cancel the other two builds mid-compile, turning a single
      # flake into a triple-red run. Let each OS finish and report honestly.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # NOTE: master / development target current macOS (host SDK default) plus
    # Linux and Windows — no MACOSX_DEPLOYMENT_TARGET pin here. The Catalina
    # (10.15) compatibility line lives on the `macOS-10.15` branch, which sets
    # MACOSX_DEPLOYMENT_TARGET=10.15 in its own workflow copy.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint & type-check
        run: npx tsc --noEmit

      - name: Run tests
        # --retry=2: parity with playwright.config.ts `retries: 2`. The jsdom
        # UI suites are timing-sensitive on loaded runners (windows-latest
        # flaked a different file each run); a real regression still fails
        # three times deterministically, so the gate stays honest.
        run: npm test -- --retry=2

      - name: Build Frontend
        run: npm run build

      # Tauri v2's wry/tao webview backend on Linux needs WebKit2GTK + GLib/GIO
      # development headers (not preinstalled on ubuntu-latest). macOS/Windows
      # ship their webview SDKs, so this step is Linux-only (#398).
      - name: Install Linux system dependencies (Tauri v2)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libgirepository1.0-dev librsvg2-dev libssl-dev pkg-config

      # Run the Rust backend unit tests (~98 tests across ax/ooxml/odf/pdf_tools/
      # config_validation/browser_* modules). Ignored tests (the #67 Chromium
      # spike harness) are skipped automatically. Previously these ran only
      # locally; execute them in CI so backend regressions are caught (#415).
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency vulnerability scanning (#37). Runs independently of the build so a
  # newly-disclosed advisory surfaces even when the build matrix is green.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm dependency audit
        # Audit production dependencies only (--omit=dev). vite/vitest and their
        # transitive dev deps are build/test tooling that never ships in the
        # Tauri binary; scoping to prod keeps this gate meaningful for the
        # shipped surface. Fail only on high/critical advisories.
        run: npm audit --omit=dev --audit-level=high

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo dependency audit
        working-directory: src-tauri
        # .cargo/audit.toml (in src-tauri/) suppresses unmaintained advisories
        # for transitive crates we cannot easily upgrade, and documents the
        # tracked exception for the umya-spreadsheet quick-xml 0.37.5 copy
        # (#395). cargo-audit reads `.cargo/audit.toml`, not a bare audit.toml.
        run: cargo audit

  # Playwright browser E2E (#16b, #214). Runs on Ubuntu where Chromium is
  # installable; covers the web UI surface (Tauri-only features excluded).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
